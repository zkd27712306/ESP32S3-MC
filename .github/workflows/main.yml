name: ESP32-S3 云构建

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Show PlatformIO version
        run: pio --version

      - name: Compile firmware
        working-directory: ./ESP32S3-MC-main
        run: |
          pio run -e 4d_systems_esp32s3_gen4_r8n16

      - name: List build output
        working-directory: ./ESP32S3-MC-main
        run: |
          ls -lh .pio/build/4d_systems_esp32s3_gen4_r8n16/

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-firmware
          path: |
            ESP32S3-MC-main/.pio/build/4d_systems_esp32s3_gen4_r8n16/firmware.bin
            ESP32S3-MC-main/.pio/build/4d_systems_esp32s3_gen4_r8n16/bootloader.bin
            ESP32S3-MC-main/.pio/build/4d_systems_esp32s3_gen4_r8n16/partitions.bin
          retention-days: 30

      - name: Delete old workflow runs
        if: always()
        run: |
          gh run list \
            --workflow="ESP32-S3 云构建" \
            --limit 100 \
            --json databaseId,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[1:] | .[].databaseId' \
          | xargs -I {} gh run delete {} --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
