name: ESP32-S3 Cloud Build

on:
  push:
    branches: [ change ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Show PlatformIO version
        run: pio --version

      - name: Compile firmware
        working-directory: ./ESP32S3-MC-main
        run: |
          pio run -e 4d_systems_esp32s3_gen4_r8n16

      - name: List build output
        working-directory: ./ESP32S3-MC-main
        run: |
          ls -lh .pio/build/4d_systems_esp32s3_gen4_r8n16/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-firmware
          path: |
            ESP32S3-MC-main/.pio/build/4d_systems_esp32s3_gen4_r8n16/firmware.bin
            ESP32S3-MC-main/.pio/build/4d_systems_esp32s3_gen4_r8n16/firmware.elf
            ESP32S3-MC-main/.pio/build/4d_systems_esp32s3_gen4_r8n16/bootloader.bin
            ESP32S3-MC-main/.pio/build/4d_systems_esp32s3_gen4_r8n16/partitions.bin
          retention-days: 30
